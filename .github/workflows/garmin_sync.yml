name: Garmin Sync

on:
  workflow_dispatch:
    # Manueel te starten via GitHub Actions tab
    # OF via de knop op de site (via GitHub API)
    inputs:
      week:
        description: 'Specifieke week exporteren (leeg = alle toekomstige weken)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (geen echte uploads)'
        required: false
        default: 'false'

jobs:
  garmin-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install garminconnect requests

      - name: Sync naar Garmin Connect
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          python garmin_sync.py $ARGS
