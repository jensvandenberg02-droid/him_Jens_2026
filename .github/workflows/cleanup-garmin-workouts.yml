name: Cleanup Garmin Workouts (eenmalig)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Typ EXACT "VERWIJDER ALLES" om te bevestigen'
        required: true
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install garminconnect

      - name: Controleer bevestiging
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "VERWIJDER ALLES" ]; then
            echo "❌ Bevestiging klopt niet — geannuleerd. Typ exact: VERWIJDER ALLES"
            exit 1
          fi
          echo "✅ Bevestiging correct, doorgaan met opruimen..."

      - name: Alle workouts verwijderen
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python cleanup_garmin_workouts.py --confirm
