name: Push Single Workout to Garmin

on:
  repository_dispatch:
    types: [push-workout]
  workflow_dispatch:
    # Handmatig testen kan ook gewoon via de Actions tab
    inputs:
      week:
        description: 'Weeknummer (bv. 13)'
        required: true
      name:
        description: 'Sessienaam (bv. "Loop — kort herstart")'
        required: true
      day:
        description: 'Dag (bv. "Dinsdag")'
        required: true
      color:
        description: 'Sessie-type: run, bike, swim, str of rest'
        required: false
        default: 'run'
      desc:
        description: 'Beschrijving van de sessie'
        required: false
        default: ''
      meta:
        description: 'Meta-info (afstand/duur/hartslagzone)'
        required: false
        default: ''

jobs:
  push-workout:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install garminconnect

      - name: Payload bepalen (repository_dispatch of workflow_dispatch)
        run: |
          echo "Event name: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "WEEK_NUM=${{ github.event.client_payload.week }}" >> "$GITHUB_ENV"
            echo "SESS_NAME=${{ github.event.client_payload.name }}" >> "$GITHUB_ENV"
            echo "SESS_DAY=${{ github.event.client_payload.day }}" >> "$GITHUB_ENV"
            echo "SESS_COLOR=${{ github.event.client_payload.color }}" >> "$GITHUB_ENV"
            echo "SESS_DESC=${{ github.event.client_payload.desc }}" >> "$GITHUB_ENV"
            echo "SESS_META=${{ github.event.client_payload.meta }}" >> "$GITHUB_ENV"
          else
            echo "WEEK_NUM=${{ github.event.inputs.week }}" >> "$GITHUB_ENV"
            echo "SESS_NAME=${{ github.event.inputs.name }}" >> "$GITHUB_ENV"
            echo "SESS_DAY=${{ github.event.inputs.day }}" >> "$GITHUB_ENV"
            echo "SESS_COLOR=${{ github.event.inputs.color }}" >> "$GITHUB_ENV"
            echo "SESS_DESC=${{ github.event.inputs.desc }}" >> "$GITHUB_ENV"
            echo "SESS_META=${{ github.event.inputs.meta }}" >> "$GITHUB_ENV"
          fi

      - name: Toon ontvangen payload (debug)
        run: |
          echo "Week: '$WEEK_NUM'"
          echo "Naam: '$SESS_NAME'"
          echo "Dag: '$SESS_DAY'"
          echo "Kleur: '$SESS_COLOR'"
          echo "Desc: '$SESS_DESC'"
          echo "Meta: '$SESS_META'"

      - name: Push workout naar Garmin
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python push_single_workout.py \
            --week "$WEEK_NUM" \
            --name "$SESS_NAME" \
            --day "$SESS_DAY" \
            --color "$SESS_COLOR" \
            --desc "$SESS_DESC" \
            --meta "$SESS_META"
