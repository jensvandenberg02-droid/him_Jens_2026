name: Strava Auto-Update

on:
  schedule:
    # 5x per dag, gespreid over de dag (tijden in UTC).
    # Met Belgische zomertijd (UTC+2, momenteel van toepassing) komt dit overeen met:
    #   04:00 UTC → 06:00 BE   (ochtend, na nacht/slaap)
    #   08:00 UTC → 10:00 BE   (voormiddag)
    #   12:00 UTC → 14:00 BE   (namiddag)
    #   16:00 UTC → 18:00 BE   (na werk/avondtraining)
    #   20:00 UTC → 22:00 BE   (late avond, vangt avondtraining + dagdata op)
    # In de winter (CET, UTC+1) verschuiven deze tijden 1 uur vroeger lokaal.
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    # Ook manueel te starten via GitHub Actions tab

jobs:
  update-site:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install requests garminconnect

      - name: Site updaten met Strava + Garmin data
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          JSON_BIN_ID:          ${{ secrets.JSON_BIN_ID }}
          JSONBIN_BIN_ID:       ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_API_KEY:      ${{ secrets.JSONBIN_API_KEY }}
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
        run: python update_site.py

      - name: Wijzigingen committen en pushen
        run: |
          git config user.name  "Strava Bot"
          git config user.email "bot@strava-update.local"
          git add index.html
          git diff --staged --quiet || git commit -m "🏃 Auto-update: Strava + Garmin data $(date +'%d/%m/%Y %H:%M')"
          git push
